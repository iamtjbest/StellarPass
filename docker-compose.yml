version: '3.9'

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: stellarpass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stellarpass
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stellarpass_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stellarpass -d stellarpass_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis Cache ----
  redis:
    image: redis:7-alpine
    container_name: stellarpass_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend (NestJS) ----
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: stellarpass_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://stellarpass:password@postgres:5432/stellarpass_db
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    volumes:
      - ./uploads:/app/uploads

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: stellarpass_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
